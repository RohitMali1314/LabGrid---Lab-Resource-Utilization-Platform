spring.application.name=Lab-Resource-Utilization-Platform

# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/lab_resource_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=localhost:9092

# -------------------------
# Producer
# -------------------------

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# -------------------------
# Consumer
# -------------------------

spring.kafka.consumer.group-id=lab-resource-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.value.default.type=com.project.Lab.Resource.Utilization.Platform.dto.NotificationEvent


# =========================================================
# KAFKA LOGGING
# =========================================================

logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO


# =========================================================
# SPRING SECURITY LOGGING
# =========================================================

logging.level.org.springframework.security=TRACE


